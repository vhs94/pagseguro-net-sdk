name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Necessário para o deploy no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um que já esteja em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore PagSeguro.DotNet.Sdk.sln

      # O docfx lê os comentários XML dos assemblies, então o build precisa vir antes.
      - name: Build solution
        run: dotnet build PagSeguro.DotNet.Sdk.sln --configuration Release --no-restore

      - name: Build docs
        run: dotnet docfx docfx.json --warningsAsErrors false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
